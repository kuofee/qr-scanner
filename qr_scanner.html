<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QR Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #000; color: #fff; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; }
  </style>
</head>
<body>
  <h3>📷 Scan Customer QR Code</h3>
  <div id="reader"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    function onScanSuccess(decodedText) {
      // Send scanned username/link back to Telegram bot
      tg.sendData(decodedText);
      tg.close();
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
