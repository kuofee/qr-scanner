<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shop Counter Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --success-color: #22c55e;
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h2 {
      margin: 0;
      font-size: 1.4rem;
      color: var(--accent-color);
    }
    .header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      opacity: 0.7;
    }
    #reader {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    #result-card {
      margin-top: 20px;
      width: 100%;
      max-width: 380px;
      padding: 16px;
      background: var(--card-bg);
      border-radius: 12px;
      text-align: center;
      display: none;
      box-sizing: border-box;
      border: 1px solid var(--success-color);
    }
    #result-card.active {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>🏪 Shop Counter Scanner</h2>
    <p>Scan customer QR code to fetch order details</p>
  </div>

  <div id="reader"></div>

  <div id="result-card">
    <div style="font-weight: bold; color: var(--success-color); margin-bottom: 4px;">✅ Scanned Successfully</div>
    <div id="scanned-text" style="word-break: break-all; font-family: monospace;"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const html5QrCode = new Html5Qrcode("reader");

    function onScanSuccess(decodedText, decodedResult) {
      // Haptic feedback trigger on mobile
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }

      const resultCard = document.getElementById('result-card');
      const resultText = document.getElementById('scanned-text');
      
      resultText.innerText = decodedText;
      resultCard.classList.add('active');

      // Stop scanner before sending data to prevent double-firing
      html5QrCode.stop().then(() => {
        setTimeout(() => {
          if (tg) {
            tg.sendData(decodedText);
            tg.close();
          }
        }, 400);
      }).catch(() => {
        if (tg) {
          tg.sendData(decodedText);
          tg.close();
        }
      });
    }

    // Automatically start the main rear camera without showing a dropdown of lenses
    const qrConfig = { fps: 10, qrbox: { width: 220, height: 220 } };
    
    html5QrCode.start(
      { facingMode: "environment" }, 
      qrConfig, 
      onScanSuccess,
      (errorMessage) => {
        // Ignore frame-by-frame scan misses to keep console clean
      }
    ).catch((err) => {
      console.error("Camera start error:", err);
      alert("Could not access camera. Please ensure camera permissions are allowed in your browser/Telegram settings.");
    });
  </script>
</body>
</html>
